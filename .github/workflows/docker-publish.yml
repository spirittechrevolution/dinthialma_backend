# ===================================================================
# Dinthialma Backend – CI/CD
# Format → Test → Build & Push Docker Hub → Deploy VPS → Health Check
# ===================================================================
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   DOCKER_HUB_USERNAME    → ton username Docker Hub
#   DOCKER_HUB_TOKEN       → token Docker Hub (Read/Write)
#   VPS_HOST               → 155.117.40.193
#   VPS_USER               → administrator
#   VPS_SSH_PRIVATE_KEY    → contenu de ~/.ssh/deploy_key
# ===================================================================

name: CI/CD – Backend

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docker/grafana/**'
      - '.gitignore'

jobs:

  # ═══════════════════════════════════════════════════════════════
  # STAGE 1 – Google Java Format
  # ═══════════════════════════════════════════════════════════════
  format-check:
    name: Stage 1 – Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Check Google Java Format
        run: chmod +x mvnw && ./mvnw fmt:check -B --no-transfer-progress

  # ═══════════════════════════════════════════════════════════════
  # STAGE 2 – Compile & Test
  # ═══════════════════════════════════════════════════════════════
  test:
    name: Stage 2 – Test
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile & test
        run: chmod +x mvnw && ./mvnw test -B --no-transfer-progress

  # ═══════════════════════════════════════════════════════════════
  # STAGE 3 – Build & Push Docker Hub
  # ═══════════════════════════════════════════════════════════════
  build-push:
    name: Stage 3 – Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package (tests déjà exécutés)
        run: ./mvnw package -DskipTests -B --no-transfer-progress

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Résoudre le tag image
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=latest" >> $GITHUB_OUTPUT
          else
            echo "value=develop" >> $GITHUB_OUTPUT
          fi

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/dinthialma-backend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════
  # STAGE 4 – Deploy to VPS (main uniquement)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Stage 4 – Deploy
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          timeout: 300s
          script: |
            set -e
            cd /opt/dinthialma/backend

            echo "=== Git pull ==="
            git pull origin main

            echo "=== Login Docker Hub ==="
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            echo "=== Pull nouvelle image backend ==="
            docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod pull backend

            echo "=== Redémarrage backend ==="
            docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod \
              up -d --no-deps --remove-orphans backend

            echo "=== Attente healthcheck (max 3 min) ==="
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' dinthialma-backend-prod 2>/dev/null || echo "starting")
              echo "Attempt $i/18 – $STATUS"
              [ "$STATUS" = "healthy" ] && break
              [ $i -eq 18 ] && echo "Timeout healthcheck" && exit 1
              sleep 10
            done

            docker image prune -f
            echo "=== Déploiement backend terminé ==="

  # ═══════════════════════════════════════════════════════════════
  # STAGE 5 – Health Check post-déploiement
  # ═══════════════════════════════════════════════════════════════
  health-check:
    name: Stage 5 – Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Vérifier /actuator/health
        run: |
          echo "Attente backend (max 3 min)..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.${{ vars.DOMAIN || 'dinthialma.com' }}/actuator/health || echo "000")
            echo "Attempt $i/18 – HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "Backend healthy" && exit 0
            sleep 10
          done
          echo "Health check échoué"
          exit 1
