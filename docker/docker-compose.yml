# ===================================================================
# Dinthialma Backend – Infrastructure Docker (développement)
# ===================================================================
#
# Services            | Port hôte  | URL
# ——————————————————— | ————————— | ——————————————————————————————————
# PostgreSQL          | 5434       | jdbc:postgresql://localhost:5434
# pgAdmin             | 5051       | http://localhost:5051
# Keycloak            | 8280       | http://localhost:8280
# Dozzle (logs)       | 8889       | http://localhost:8889
# Backend API         | 8081       | http://localhost:8081/api
# Swagger UI          | 8081       | http://localhost:8081/api/swagger-ui.html
# Prometheus          | 9091       | http://localhost:9091
# Grafana             | 3002       | http://localhost:3002
#
# Démarrage infrastructure seule : docker compose up -d
# Backend + infra     : docker compose --profile full-stack up -d
# Monitoring          : docker compose --profile monitoring up -d
# ===================================================================

services:

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL 17 – Serveur unique, 2 bases de données
  #   • db-dinthialma         → application backend
  #   • db-keycloak-dinthialma → Keycloak IAM
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: dinthialma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    networks:
      - dinthialma-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────
  # pgAdmin 4 – Interface web PostgreSQL
  #   Mode Desktop (SERVER_MODE=False) → pas d'écran de connexion
  # ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dinthialma-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    networks:
      - dinthialma-net
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # Keycloak 26 – IAM / OAuth2 / OIDC
  #   Mode : start-dev (HTTP, sans HTTPS requis)
  #   Base de données : db-keycloak-dinthialma (PostgreSQL)
  #   Realm : dinthialma
  #   ⚠️  start-dev est réservé au développement uniquement
  # ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.5
    container_name: dinthialma-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      - "${KEYCLOAK_PORT:-8280}:8080"
    networks:
      - dinthialma-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok >&3 && exec 3>&-"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  # Backend Spring Boot – Dinthialma API
  #   Usage  : docker compose --profile full-stack up -d
  #   Accès  : http://localhost:8081/api
  #   Swagger: http://localhost:8081/api/swagger-ui.html
  #
  #   ℹ️  En développement, lancer le backend depuis l'IDE (plus rapide,
  #       hot-reload, debug possible). Ce service est utile pour CI/CD.
  # ─────────────────────────────────────────────────────────────────
  backend:
    profiles:
      - full-stack
    build:
      context: ..
      dockerfile: Dockerfile
    image: dinthialma-backend:latest
    pull_policy: build
    container_name: dinthialma-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}
      SERVER_SERVLET_CONTEXT_PATH: /api
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-superadmin@dinthialma.io}
      BOOTSTRAP_SUPER_ADMIN_FIRST_NAME: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:-Super}
      BOOTSTRAP_SUPER_ADMIN_LAST_NAME: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:-Admin}
      BOOTSTRAP_SUPER_ADMIN_PHONE: ${BOOTSTRAP_SUPER_ADMIN_PHONE:-+221000000000}
      OPENWA_API_URL: http://openwa:3000
      OPENWA_MOCK: ${OPENWA_MOCK:-false}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    networks:
      - dinthialma-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  # Prometheus – Collecte des métriques (profil monitoring)
  # ─────────────────────────────────────────────────────────────────
  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:latest
    container_name: dinthialma-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9091:9090"
    networks:
      - dinthialma-net

  # ─────────────────────────────────────────────────────────────────
  # Grafana – Dashboards de monitoring (profil monitoring)
  #   Accès : http://localhost:3002   login : admin / admin
  # ─────────────────────────────────────────────────────────────────
  grafana:
    profiles:
      - monitoring
    image: grafana/grafana:latest
    container_name: dinthialma-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    networks:
      - dinthialma-net
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────────────────────────
  # OpenWA (wa-automate) – API WhatsApp pour les notifications
  #   Accès API : http://localhost:3000
  #   1ère utilisation : docker compose up openwa -d
  #                      docker logs -f dinthialma-openwa  ← scanner le QR code
  #   Session sauvegardée dans le volume openwa_data (persistante)
  # ─────────────────────────────────────────────────────────────────
  openwa:
    build:
      context: ./openwa
      dockerfile: Dockerfile
    image: dinthialma-openwa:latest
    pull_policy: build
    container_name: dinthialma-openwa
    restart: unless-stopped
    volumes:
      - openwa_sessions:/sessions
    ports:
      - "${OPENWA_PORT:-3000}:3000"
    networks:
      - dinthialma-net

  # ─────────────────────────────────────────────────────────────────
  # Dozzle – Visualisation des logs de tous les conteneurs
  #   Accès : http://localhost:8889
  # ─────────────────────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dinthialma-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-8889}:8080"
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300
    networks:
      - dinthialma-net

# ─── Volumes persistants ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
    name: dinthialma_postgres_data
  pgadmin_data:
    driver: local
    name: dinthialma_pgadmin_data
  prometheus_data:
    driver: local
    name: dinthialma_prometheus_data
  grafana_data:
    driver: local
    name: dinthialma_grafana_data
  openwa_sessions:
    driver: local
    name: dinthialma_openwa_sessions

# ─── Réseau interne ──────────────────────────────────────────────
networks:
  dinthialma-net:
    driver: bridge
    name: dinthialma-net
