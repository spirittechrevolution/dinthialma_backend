server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}
  max-http-request-header-size: 126KB
  forward-headers-strategy: framework

spring:
  application:
    name: dinthialma-backend

  jackson:
    default-property-inclusion: non_null

  # ─── Pagination ───────────────────────────────────────────────────
  data:
    web:
      pageable:
        max-page-size: 200
        default-page-size: 20

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ─── Multipart (upload fichiers) ─────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ─── PostgreSQL ──────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:db-dinthialma}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:dinthialma123}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: dinthialma
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false

  flyway:
    enabled: true
    default-schema: dinthialma
    schemas: dinthialma
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: false

  # ─── Keycloak OAuth2 Resource Server ─────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8280/realms/dinthialma}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8280/realms/dinthialma}/protocol/openid-connect/certs

  # ─── JavaMail – SMTP ─────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@dinthialma.io}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # ─── Thymeleaf ───────────────────────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# ─── Keycloak Client ─────────────────────────────────────────────
keycloak:
  realm: ${KEYCLOAK_REALM:dinthialma}
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8280}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  issuer-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}
  # Credentials de l'admin du realm master – utilisés par le Keycloak Admin Client
  # pour la gestion CRUD des utilisateurs (grant_type=password, client=admin-cli).
  admin-username: ${KEYCLOAK_ADMIN_USER:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

# ─── Swagger / OpenAPI ───────────────────────────────────────────
springdoc:
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    # Pré-rempli le champ clientId dans le dialog "Authorize" de Swagger UI
    oauth:
      client-id: ${keycloak.client-id}
      realm: ${keycloak.realm}
    # Désactive le filtre de tags pour afficher tous les endpoints
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}
  default-produces-media-type: application/json
  model-and-view-allowed: false
  # Le context-path (/api) est ajouté manuellement dans OpenApiConfig via @Bean OpenAPI.
  # use-management-port: false est implicite.

# ─── Actuator / Monitoring ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Mail SMTP non configuré en dev – désactive le health check pour éviter
    # l'erreur AuthenticationFailedException au démarrage.
    mail:
      enabled: false

# ─── Dinthialma Application ──────────────────────────────────────
dinthialma:
  security:
    enabled: ${SECURITY_ENABLED:true}
  endpoints:
    frontend: ${FRONTEND_URL:http://localhost:3000,http://localhost:5173,http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@dinthialma.io}
    admin-email: ${ADMIN_EMAIL:admin@dinthialma.io}
    from-name: ${MAIL_FROM_NAME:Dinthialma}

  # ─── Bootstrap Super Admin (premier démarrage uniquement) ─────────
  # Activer uniquement si la DB est vierge. Désactiver après le premier login.
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:admin@dinthialma.io}
    first-name: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:Super}
    last-name: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:Admin}
    phone: ${BOOTSTRAP_SUPER_ADMIN_PHONE:+221783703310}
    # ⚠️ À changer immédiatement après le premier login
    password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:password123}

# ─── Logging (base — production-safe) ───────────────────────────
logging:
  level:
    root: INFO
    com.africa.dinthialma_backend: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.thymeleaf: WARN

# ─── Sécurité applicative ────────────────────────────────────────
app:
  security:
    # Clé de chiffrement AES-256 pour les refresh tokens Keycloak en base de données.
    # ⚠️ OBLIGATOIRE en production – doit être une chaîne forte de 32+ caractères.
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:dinthialma-default-key-change-in-prod!}

# ─── SMS – LAfricaMobile (LAMPUSH) ────────────────────────────────
lam:
  sms:
    api-url: ${LAM_SMS_URL:https://lamsms.lafricamobile.com/api}
    account-id: ${LAM_ACCOUNT_ID:}
    password: ${LAM_PASSWORD:}
    sender: ${LAM_SENDER:DINTHIALMA}
